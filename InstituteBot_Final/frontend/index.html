<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>InstituteBot 🎓</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Cabinet+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
/* ── Reset & Variables ─────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c12;
  --panel:#0f1520;
  --card:#161e2c;
  --card2:#1c2638;
  --border:#1f2d42;
  --border2:#2a3d58;
  --gold:#f5c842;
  --gold2:#d4a017;
  --gold-dim:rgba(245,200,66,.12);
  --gold-glow:rgba(245,200,66,.25);
  --text:#e8f0f8;
  --text2:#8fa8c0;
  --muted:#4a6070;
  --green:#4ecca3;
  --red:#f06060;
  --orange:#f0a030;
  --user:#0f2240;
  --bot:#161e2c;
  --radius:16px;
}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);
  font-family:'Cabinet Grotesk',sans-serif;
  color:var(--text);
  /* subtle dot grid */
  background-image:radial-gradient(rgba(245,200,66,.04) 1px, transparent 1px);
  background-size:28px 28px;
}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}

/* ── Layout ─────────────────────────────────────────────── */
.layout{
  display:grid;
  grid-template-columns:270px 1fr;
  height:100vh;
}

/* ── Sidebar ─────────────────────────────────────────────── */
.sidebar{
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.sb-header{
  padding:28px 22px 20px;
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:14px}
.brand-icon{
  width:46px;height:46px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  display:flex;align-items:center;justify-content:center;
  font-size:22px;
  box-shadow:0 4px 20px var(--gold-glow);
}
.brand-title{
  font-family:'Clash Display',sans-serif;
  font-size:18px;font-weight:600;color:var(--text);
  line-height:1.15;
}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-top:2px}

.status-row{display:flex;flex-direction:column;gap:8px;margin-top:14px}

.badge{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 12px;border-radius:99px;font-size:11px;
  border:1px solid;width:fit-content;
}
.badge-green{background:rgba(78,204,163,.08);border-color:rgba(78,204,163,.25);color:var(--green)}
.badge-status{
  background:var(--card);border:1px solid var(--border);
  color:var(--text2);font-size:11px;padding:6px 12px;
  border-radius:9px;display:flex;align-items:center;gap:8px;
}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-pulse{background:var(--green);animation:pulse 2s infinite}
.dot-spin{background:var(--orange);animation:pulse 1s infinite}
.dot-ok{background:var(--green);box-shadow:0 0 8px var(--green)}
.dot-err{background:var(--red);box-shadow:0 0 8px var(--red)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}

/* Sidebar sections */
.sb-section{padding:18px 20px 10px}
.sb-section-title{
  font-size:10px;text-transform:uppercase;
  letter-spacing:.1em;color:var(--muted);margin-bottom:10px;
}

.sb-btn{
  width:100%;text-align:left;
  background:transparent;border:1px solid transparent;
  border-radius:10px;color:var(--text2);
  font-family:'Cabinet Grotesk',sans-serif;font-size:13.5px;
  padding:9px 12px;cursor:pointer;
  transition:all .15s;
  display:flex;align-items:center;gap:10px;
  margin-bottom:4px;
}
.sb-btn:hover{background:var(--card);border-color:var(--border);color:var(--text)}
.sb-btn-icon{font-size:16px;width:22px;text-align:center;flex-shrink:0}

.sb-divider{height:1px;background:var(--border);margin:6px 20px}

.sb-footer{
  margin-top:auto;
  padding:18px 20px;
  border-top:1px solid var(--border);
}
.week-chip{
  background:var(--gold-dim);
  border:1px solid rgba(245,200,66,.2);
  border-radius:12px;padding:13px 15px;
  display:flex;justify-content:space-between;align-items:center;
}
.wc-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.wc-value{
  font-family:'Clash Display',sans-serif;
  font-size:14px;font-weight:600;color:var(--gold);
}

/* ── Main Chat Area ─────────────────────────────────────── */
.chat-main{
  display:flex;flex-direction:column;
  overflow:hidden;background:transparent;
}

/* Topbar */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px;
  border-bottom:1px solid var(--border);
  background:rgba(8,12,18,.9);
  backdrop-filter:blur(20px);
  flex-shrink:0;
}
.topbar-left{display:flex;align-items:center;gap:13px}
.topbar-avatar{
  width:40px;height:40px;border-radius:12px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  display:flex;align-items:center;justify-content:center;
  font-size:19px;box-shadow:0 2px 14px var(--gold-glow);
}
.topbar-name{font-family:'Clash Display',sans-serif;font-size:16px;font-weight:600}
.topbar-sub{font-size:12px;color:var(--muted);margin-top:1px}
.topbar-actions{display:flex;gap:8px}
.icon-btn{
  width:36px;height:36px;
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;color:var(--text2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:15px;transition:all .15s;
}
.icon-btn:hover{background:var(--card2);color:var(--text)}

/* Messages */
.messages{
  flex:1;overflow-y:auto;
  padding:28px;
  display:flex;flex-direction:column;gap:18px;
}

/* Welcome screen */
.welcome{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;gap:14px;
  animation:fadeUp .6s ease both;
}
.welcome-icon{
  width:88px;height:88px;border-radius:26px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  display:flex;align-items:center;justify-content:center;
  font-size:40px;margin-bottom:6px;
  box-shadow:0 12px 40px var(--gold-glow);
}
.welcome h2{
  font-family:'Clash Display',sans-serif;
  font-size:30px;font-weight:700;line-height:1.2;
}
.welcome p{font-size:14px;color:var(--text2);max-width:380px;line-height:1.8}
.suggestion-chips{
  display:flex;flex-wrap:wrap;gap:8px;
  justify-content:center;margin-top:6px;max-width:520px;
}
.sug-chip{
  background:var(--card);border:1px solid var(--border);
  color:var(--text2);font-family:'Cabinet Grotesk',sans-serif;
  font-size:13px;padding:8px 16px;border-radius:99px;
  cursor:pointer;transition:all .15s;
}
.sug-chip:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-dim)}

/* Message rows */
.msg-row{
  display:flex;gap:12px;
  animation:fadeUp .3s ease both;
}
.msg-row.user{flex-direction:row-reverse}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

.msg-avatar{
  width:34px;height:34px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;flex-shrink:0;margin-top:2px;
}
.msg-avatar.bot{
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  box-shadow:0 2px 10px var(--gold-glow);
}
.msg-avatar.user{
  background:var(--user);
  border:1px solid rgba(30,80,140,.5);
}

.msg-body{
  max-width:68%;
  display:flex;flex-direction:column;gap:5px;
}
.msg-row.user .msg-body{align-items:flex-end}

/* Tags above bubble */
.msg-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:2px}
.msg-tag{
  font-size:11px;font-weight:600;
  padding:2px 10px;border-radius:99px;
  display:inline-flex;align-items:center;gap:4px;
}
.tag-intent{
  background:rgba(78,204,163,.08);
  border:1px solid rgba(78,204,163,.22);
  color:var(--green);
}
.tag-entity{
  background:var(--gold-dim);
  border:1px solid rgba(245,200,66,.22);
  color:var(--gold);
}

/* Bubbles */
.bubble{
  padding:13px 17px;border-radius:var(--radius);
  font-size:14px;line-height:1.75;
  white-space:pre-wrap;word-break:break-word;
}
.bubble.bot{
  background:var(--bot);
  border:1px solid var(--border);
  border-top-left-radius:3px;
}
.bubble.user{
  background:var(--user);
  border:1px solid rgba(30,100,200,.3);
  border-top-right-radius:3px;
  color:var(--text);
}
.bubble.error{
  background:rgba(240,96,96,.08);
  border:1px solid rgba(240,96,96,.25);
  color:var(--red);
}
.bubble.handover{
  background:rgba(240,160,48,.08);
  border:1px solid rgba(240,160,48,.25);
}

/* Meta row below bubble */
.msg-meta{
  font-size:11px;color:var(--muted);
  padding:0 3px;
  display:flex;align-items:center;gap:7px;
}
.conf-track{
  width:54px;height:3px;
  background:var(--border);border-radius:99px;overflow:hidden;
}
.conf-fill{
  height:100%;
  background:linear-gradient(90deg,var(--gold),var(--gold2));
  border-radius:99px;
}

/* Typing indicator */
.typing-row{display:flex;gap:12px;align-items:center}
.typing-bubble{
  background:var(--bot);border:1px solid var(--border);
  border-radius:var(--radius);border-top-left-radius:3px;
  padding:14px 18px;display:flex;gap:5px;align-items:center;
}
.typing-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--muted);animation:bounce 1.2s infinite;
}
.typing-dot:nth-child(2){animation-delay:.15s}
.typing-dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{
  0%,60%,100%{transform:translateY(0);opacity:.4}
  30%{transform:translateY(-6px);opacity:1}
}

/* Input */
.input-area{
  padding:14px 28px 24px;
  flex-shrink:0;
}
.input-box{
  display:flex;align-items:flex-end;gap:10px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:12px 14px;
  transition:border-color .2s,box-shadow .2s;
}
.input-box:focus-within{
  border-color:var(--gold);
  box-shadow:0 0 0 3px var(--gold-dim);
}
.chat-input{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--text);font-family:'Cabinet Grotesk',sans-serif;
  font-size:14.5px;resize:none;line-height:1.6;
  max-height:120px;overflow-y:auto;
}
.chat-input::placeholder{color:var(--muted)}
.send-button{
  width:38px;height:38px;flex-shrink:0;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  border:none;border-radius:11px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;
  transition:all .15s;
  box-shadow:0 3px 14px var(--gold-glow);
}
.send-button:hover:not([disabled]){
  transform:scale(1.08);
  box-shadow:0 6px 20px var(--gold-glow);
}
.send-button[disabled]{opacity:.3;cursor:not-allowed}
.input-hint{
  font-size:11px;color:var(--muted);
  text-align:center;margin-top:9px;
}

/* ── Analytics Modal ─────────────────────────────────────── */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(8px);
  z-index:100;
  display:flex;align-items:center;justify-content:center;
  animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--panel);
  border:1px solid var(--border2);
  border-radius:24px;
  padding:32px;
  width:460px;max-width:94vw;max-height:90vh;
  overflow-y:auto;
  box-shadow:0 24px 64px rgba(0,0,0,.7);
  animation:scaleIn .22s ease;
}
@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.modal-title{
  font-family:'Clash Display',sans-serif;
  font-size:24px;font-weight:700;
  margin-bottom:24px;
  display:flex;align-items:center;gap:10px;
}
.stats-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:12px;margin-bottom:20px;
}
.stat-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:18px;
}
.stat-number{
  font-family:'Clash Display',sans-serif;
  font-size:32px;font-weight:700;color:var(--gold);
  line-height:1;margin-bottom:5px;
}
.stat-label{font-size:12px;color:var(--muted)}
.section-label{
  font-size:10px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--muted);margin:18px 0 10px;
}
.intent-row{
  display:flex;align-items:center;gap:10px;margin-bottom:10px;
}
.intent-name{font-size:13px;color:var(--text);width:115px;flex-shrink:0}
.intent-bar-bg{flex:1;height:6px;background:var(--border);border-radius:99px;overflow:hidden}
.intent-bar{
  height:100%;
  background:linear-gradient(90deg,var(--gold),var(--gold2));
  border-radius:99px;
  transition:width .7s ease;
}
.intent-count{font-size:12px;color:var(--muted);width:24px;text-align:right}
.modal-close{
  width:100%;margin-top:20px;padding:12px;
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;color:var(--text);
  font-family:'Cabinet Grotesk',sans-serif;font-size:14px;
  cursor:pointer;transition:all .15s;
}
.modal-close:hover{background:var(--card2)}

/* Loading spinner in modal */
.loading{
  text-align:center;padding:40px 0;
  color:var(--muted);font-size:14px;
}
.spinner{
  width:32px;height:32px;border-radius:50%;
  border:3px solid var(--border2);
  border-top-color:var(--gold);
  animation:spin .7s linear infinite;
  margin:0 auto 12px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Responsive */
@media(max-width:660px){
  .layout{grid-template-columns:1fr}
  .sidebar{display:none}
}
</style>
</head>
<body>
<div class="layout">

  <!-- ═══════════════ SIDEBAR ═══════════════ -->
  <aside class="sidebar">
    <div class="sb-header">
      <div class="brand">
        <div class="brand-icon">🎓</div>
        <div>
          <div class="brand-title">InstituteBot</div>
          <div class="brand-sub">Academic Assistant</div>
        </div>
      </div>
      <div class="status-row">
        <div class="badge badge-green">
          <div class="dot dot-pulse"></div>
          Online · Weeks 1–10 Active
        </div>
        <div class="badge-status">
          <div class="dot dot-spin" id="be-dot"></div>
          <span id="be-label">Connecting to backend…</span>
        </div>
      </div>
    </div>

    <div class="sb-section">
      <div class="sb-section-title">Quick Topics</div>
      <button class="sb-btn" onclick="sendMsg('What are the college fees?')">
        <span class="sb-btn-icon">💰</span> Fees &amp; Payments
      </button>
      <button class="sb-btn" onclick="sendMsg('When are the exams scheduled?')">
        <span class="sb-btn-icon">📅</span> Exam Schedule
      </button>
      <button class="sb-btn" onclick="sendMsg('Is hostel facility available?')">
        <span class="sb-btn-icon">🏠</span> Hostel Info
      </button>
      <button class="sb-btn" onclick="sendMsg('What are the library hours?')">
        <span class="sb-btn-icon">📚</span> Library Hours
      </button>
      <button class="sb-btn" onclick="sendMsg('When do admissions open?')">
        <span class="sb-btn-icon">🎓</span> Admissions
      </button>
      <button class="sb-btn" onclick="sendMsg('How do I connect to WiFi?')">
        <span class="sb-btn-icon">🌐</span> WiFi Access
      </button>
      <button class="sb-btn" onclick="sendMsg('How do I get info about the college bus?')">
        <span class="sb-btn-icon">🚌</span> Bus Routes
      </button>
      <button class="sb-btn" onclick="sendMsg('How can I apply for a scholarship?')">
        <span class="sb-btn-icon">🏆</span> Scholarships
      </button>
      <button class="sb-btn" onclick="sendMsg('What are the canteen timings?')">
        <span class="sb-btn-icon">🍽️</span> Canteen Timings
      </button>
      <button class="sb-btn" onclick="sendMsg('When will results be declared?')">
        <span class="sb-btn-icon">📊</span> Results
      </button>
    </div>

    <div class="sb-divider"></div>

    <div class="sb-section">
      <div class="sb-section-title">Tools</div>
      <button class="sb-btn" onclick="openAnalytics()">
        <span class="sb-btn-icon">📈</span> Analytics Report
      </button>
      <button class="sb-btn" onclick="clearChat()">
        <span class="sb-btn-icon">🔄</span> New Conversation
      </button>
    </div>

    <div class="sb-footer">
      <div class="week-chip">
        <div>
          <div class="wc-label">Current Build</div>
          <div class="wc-value">February · Week 10</div>
        </div>
        <span style="font-size:24px">🏗️</span>
      </div>
    </div>
  </aside>

  <!-- ═══════════════ MAIN ═══════════════ -->
  <main class="chat-main">

    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-avatar">🤖</div>
        <div>
          <div class="topbar-name">FAQ Assistant</div>
          <div class="topbar-sub" id="topbar-status">Ready to help</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" title="Analytics" onclick="openAnalytics()">📈</button>
        <button class="icon-btn" title="New chat"  onclick="clearChat()">🗑️</button>
      </div>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages">
      <!-- Welcome screen rendered by JS -->
    </div>

    <!-- Input -->
    <div class="input-area">
      <div class="input-box">
        <textarea
          id="chat-input"
          class="chat-input"
          rows="1"
          placeholder="Ask about fees, exams, hostel, admissions, timetable…"
          onkeydown="handleKey(event)"
          oninput="onInput(this)"
        ></textarea>
        <button class="send-button" id="send-btn" onclick="sendMsg()" disabled>
          &#10148;
        </button>
      </div>
      <div class="input-hint">Enter to send &nbsp;·&nbsp; Shift+Enter for new line</div>
    </div>
  </main>
</div>

<!-- ═══════════════ ANALYTICS MODAL ═══════════════ -->
<div class="modal-overlay" id="modal" style="display:none" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title">📈 Analytics Report</div>
    <div id="modal-content">
      <div class="loading">
        <div class="spinner"></div>
        Loading analytics…
      </div>
    </div>
    <button class="modal-close" onclick="document.getElementById('modal').style.display='none'">
      Close
    </button>
  </div>
</div>

<script>
// ── Config ─────────────────────────────────────────────────────────────────
const API = 'http://localhost:5000';
let sessionId = crypto.randomUUID();
let isBusy    = false;
let msgCount  = 0;

// ── DOM refs ───────────────────────────────────────────────────────────────
const msgsEl    = document.getElementById('messages');
const inputEl   = document.getElementById('chat-input');
const sendBtn   = document.getElementById('send-btn');
const statusEl  = document.getElementById('topbar-status');
const beDot     = document.getElementById('be-dot');
const beLabel   = document.getElementById('be-label');

// ── Backend health check ───────────────────────────────────────────────────
async function checkHealth() {
  try {
    const r = await fetch(`${API}/api/health`, { signal: AbortSignal.timeout(3000) });
    if (r.ok) {
      beDot.className   = 'dot dot-ok';
      beLabel.textContent = 'Flask backend connected';
    } else throw new Error();
  } catch {
    beDot.className   = 'dot dot-err';
    beLabel.textContent = 'Backend offline — run app.py';
  }
}
checkHealth();
setInterval(checkHealth, 10000);

// ── Welcome screen ─────────────────────────────────────────────────────────
function renderWelcome() {
  msgsEl.innerHTML = `
    <div class="welcome" id="welcome-screen">
      <div class="welcome-icon">🎓</div>
      <h2>Ask me anything<br>about your institute</h2>
      <p>Powered by a Python Flask backend with TF-IDF retrieval,
         intent classification, entity extraction &amp; session-aware context.</p>
      <div class="suggestion-chips">
        <button class="sug-chip" onclick="sendMsg('What are the college fees?')">What are the fees?</button>
        <button class="sug-chip" onclick="sendMsg('When are the exams?')">When are exams?</button>
        <button class="sug-chip" onclick="sendMsg('Is hostel available?')">Is hostel available?</button>
        <button class="sug-chip" onclick="sendMsg('How do I apply for scholarship?')">Scholarship info</button>
        <button class="sug-chip" onclick="sendMsg('Library hours?')">Library hours</button>
        <button class="sug-chip" onclick="sendMsg('College bus routes?')">Bus routes</button>
        <button class="sug-chip" onclick="sendMsg('Connect to WiFi?')">WiFi info</button>
        <button class="sug-chip" onclick="sendMsg('Canteen timings?')">Canteen timings</button>
      </div>
    </div>`;
}
renderWelcome();

// ── Input handlers ─────────────────────────────────────────────────────────
function onInput(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  sendBtn.disabled = !el.value.trim() || isBusy;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
}

// ── Append a message bubble ────────────────────────────────────────────────
function appendMsg(role, text, meta = {}) {
  // Remove welcome screen on first message
  document.getElementById('welcome-screen')?.remove();

  const row = document.createElement('div');
  row.className = `msg-row ${role}`;

  // Avatar
  const av = document.createElement('div');
  av.className = `msg-avatar ${role}`;
  av.textContent = role === 'bot' ? '🤖' : '👤';

  // Body
  const body = document.createElement('div');
  body.className = 'msg-body';

  // Tags (bot only)
  if (role === 'bot' && !meta.isError) {
    const tags = [];
    if (meta.intent && meta.intent !== 'general')
      tags.push(`<span class="msg-tag tag-intent">🏷 ${meta.intent}</span>`);
    (meta.entities?.courses   || []).forEach(c => tags.push(`<span class="msg-tag tag-entity">📖 ${c}</span>`));
    (meta.entities?.semesters || []).forEach(s => tags.push(`<span class="msg-tag tag-entity">📆 ${s}</span>`));
    (meta.entities?.years     || []).forEach(y => tags.push(`<span class="msg-tag tag-entity">🎓 ${y}</span>`));
    if (tags.length) {
      const tagRow = document.createElement('div');
      tagRow.className = 'msg-tags';
      tagRow.innerHTML = tags.join('');
      body.appendChild(tagRow);
    }
  }

  // Bubble
  const bub = document.createElement('div');
  const extraClass = meta.isError ? ' error' : meta.isHandover ? ' handover' : '';
  bub.className = `bubble ${role}${extraClass}`;
  bub.textContent = text;
  body.appendChild(bub);

  // Meta (time + confidence)
  const metaEl = document.createElement('div');
  metaEl.className = 'msg-meta';
  const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  let metaHTML = `<span>${time}</span>`;
  if (role === 'bot' && meta.confidence > 0) {
    const pct = Math.round(meta.confidence * 100);
    metaHTML += `
      <div class="conf-track">
        <div class="conf-fill" style="width:${pct}%"></div>
      </div>
      <span>${pct}% match</span>`;
  }
  metaEl.innerHTML = metaHTML;
  body.appendChild(metaEl);

  row.appendChild(av);
  row.appendChild(body);
  msgsEl.appendChild(row);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

// ── Typing indicator ───────────────────────────────────────────────────────
function showTyping() {
  const el = document.createElement('div');
  el.className = 'typing-row'; el.id = 'typing-indicator';
  el.innerHTML = `
    <div class="msg-avatar bot">🤖</div>
    <div class="typing-bubble">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>`;
  msgsEl.appendChild(el);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}
function hideTyping() { document.getElementById('typing-indicator')?.remove(); }

// ── Send message ───────────────────────────────────────────────────────────
async function sendMsg(text) {
  const q = (text ?? inputEl.value).trim();
  if (!q || isBusy) return;

  // Clear input
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;

  appendMsg('user', q);
  isBusy = true;
  statusEl.textContent = 'Thinking…';
  showTyping();

  try {
    const res = await fetch(`${API}/api/chat`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ query: q, session_id: sessionId }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    sessionId = data.session_id || sessionId;
    hideTyping();
    appendMsg('bot', data.text, data);
    msgCount++;
    statusEl.textContent = `${msgCount} response${msgCount > 1 ? 's' : ''} · Session active`;
  } catch (err) {
    hideTyping();
    appendMsg('bot',
      `⚠️ Cannot reach the Flask backend.\n\n` +
      `Make sure it is running:\n` +
      `  cd backend\n  python app.py\n\n` +
      `Error: ${err.message}`,
      { isError: true }
    );
    statusEl.textContent = 'Backend error';
  } finally {
    isBusy = false;
    sendBtn.disabled = !inputEl.value.trim();
  }
}

// ── Clear chat ─────────────────────────────────────────────────────────────
async function clearChat() {
  try {
    await fetch(`${API}/api/reset`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId }),
    });
  } catch {}
  sessionId = crypto.randomUUID();
  msgCount  = 0;
  isBusy    = false;
  statusEl.textContent = 'Ready to help';
  renderWelcome();
}

// ── Analytics modal ────────────────────────────────────────────────────────
async function openAnalytics() {
  const modal   = document.getElementById('modal');
  const content = document.getElementById('modal-content');
  modal.style.display = 'flex';
  content.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>Loading analytics…
    </div>`;

  try {
    const res = await fetch(`${API}/api/analytics`);
    if (!res.ok) throw new Error();
    const d = await res.json();

    const intents = Object.entries(d.intents).sort((a,b) => b[1]-a[1]).slice(0,7);
    const maxVal  = intents[0]?.[1] || 1;

    const intentRows = intents.map(([name, count]) => `
      <div class="intent-row">
        <div class="intent-name">${name}</div>
        <div class="intent-bar-bg">
          <div class="intent-bar" style="width:${(count/maxVal)*100}%"></div>
        </div>
        <div class="intent-count">${count}</div>
      </div>`).join('');

    content.innerHTML = `
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-number">${d.total}</div>
          <div class="stat-label">Total messages</div>
        </div>
        <div class="stat-card">
          <div class="stat-number">${d.unresolved}</div>
          <div class="stat-label">Unresolved queries</div>
        </div>
        <div class="stat-card">
          <div class="stat-number">${d.resolution}%</div>
          <div class="stat-label">Resolution rate</div>
        </div>
        <div class="stat-card">
          <div class="stat-number">${Object.keys(d.intents).length}</div>
          <div class="stat-label">Intent types seen</div>
        </div>
      </div>
      ${intents.length ? `<div class="section-label">Top Intents</div>${intentRows}` : ''}`;
  } catch {
    content.innerHTML = `
      <p style="color:var(--red);padding:16px 0">
        ⚠️ Could not fetch analytics. Is the backend running?
      </p>`;
  }
}

function closeModal(e) {
  if (e.target === document.getElementById('modal'))
    document.getElementById('modal').style.display = 'none';
}
</script>
